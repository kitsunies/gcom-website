name: Contact Worker
on:
  push:
    branches: [main, master]
    paths: ['apps/contact/**', 'package*.json', '.github/workflows/contact.yml']
  pull_request:
    paths: ['apps/contact/**', 'package*.json', '.github/workflows/contact.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace @gcom/contact
      - run: npm run build:contact
