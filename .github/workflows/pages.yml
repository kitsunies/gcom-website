name: Public website
on:
  push:
    branches: [main, master]
    paths-ignore: ['apps/contact/**']
  pull_request:
    paths-ignore: ['apps/contact/**']
  workflow_dispatch:
    inputs:
      dataset:
        description: Sanity dataset to validate (staging never deploys)
        type: choice
        options: [production, staging]
        default: production
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.SANITY_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      dataset: ${{ steps.dataset.outputs.name }}
      changed: ${{ steps.release.outputs.changed }}
    env:
      ROSTER_SOURCE: ${{ github.event_name == 'pull_request' && 'fixture' || 'sanity' }}
      SANITY_PROJECT_ID: ${{ github.event_name == 'pull_request' && 'dummy1234' || vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ github.event_name == 'pull_request' && 'test' || inputs.dataset || vars.SANITY_DATASET || 'production' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://gcom.techtom.tech' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
      VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: dataset
        name: Record selected dataset
        run: echo "name=$SANITY_DATASET" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Block CMS requests in pull-request checks
        if: github.event_name == 'pull_request'
        run: echo '127.0.0.1 dummy1234.api.sanity.io dummy1234.apicdn.sanity.io wtzkb2rs.api.sanity.io wtzkb2rs.apicdn.sanity.io cdn.sanity.io' | sudo tee -a /etc/hosts
      - name: Generate synthetic roster for pull requests
        if: github.event_name == 'pull_request'
        run: npm run sync:roster
      - name: Fetch and validate the published roster once
        if: github.event_name != 'pull_request'
        env:
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: npm run sync:roster
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: apps/web/public/data/events.json
          key: gcom-calendar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gcom-calendar-v1-
      - name: Import published club events using the source-owned calendar destination
        if: github.event_name != 'pull_request'
        id: calendar
        continue-on-error: true
        env:
          LUMA_ICAL_URL: ${{ secrets.LUMA_ICAL_URL }}
        run: npm run sync:events
      - name: Report stale calendar
        if: steps.calendar.outcome == 'failure'
        run: echo '::warning::Calendar sync failed. This release uses the last valid snapshot.'
      - name: Require a previous snapshot on sync failure
        if: steps.calendar.outcome == 'failure'
        run: node -e 'if (!require("./apps/web/public/data/events.json").updatedAt) throw new Error("No previous calendar snapshot is available. Preserve the existing release.")'
      - name: Compare validated release inputs with the live deployment
        id: release
        if: vars.SANITY_PUBLICATION_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SANITY_DATASET == 'production'
        working-directory: apps/web
        run: npx tsx scripts/deployment-state.ts
      - run: npm run format:check
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
      - run: npm run test:snapshot
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
      - name: Typecheck Studio
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
        working-directory: apps/studio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ env.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ env.SANITY_DATASET }}
        run: npm run typecheck
      - name: Build Studio
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
        working-directory: apps/studio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ env.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ env.SANITY_DATASET }}
        run: npm run build
      - name: Build the validated roster snapshot without fetching CMS again
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
        run: npm run build:snapshot
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
      - run: npm run test:browser
        if: github.event_name == 'push' || steps.release.outputs.changed != 'false'
      - name: Custom domain
        if: steps.release.outputs.changed == 'true' && env.SITE_BASE == '/'
        run: node -e 'require("node:fs").writeFileSync("apps/web/dist/CNAME", new URL(process.env.SITE_ORIGIN).hostname + "\n")'
      - name: Include production state in the checked Pages artifact
        if: steps.release.outputs.changed == 'true'
        run: cp apps/web/src/generated/deployment-state.json apps/web/dist/deployment-state.json
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: apps/web/dist
  deploy:
    needs: build
    if: vars.SANITY_PUBLICATION_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.build.outputs.dataset == 'production' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
