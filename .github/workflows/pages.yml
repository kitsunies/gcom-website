name: Public website
on:
  push:
    branches: [main, master]
    paths-ignore: ['editor/**']
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://gcom.techtom.tech' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
      VITE_CALENDAR_URL: ${{ vars.LUMA_CALENDAR_URL }}
      VITE_CONTACT_EMAIL: ${{ vars.CLUB_CONTACT_EMAIL }}
      VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: public/data/events.json
          key: gcom-calendar-v1-${{ github.run_id }}
          restore-keys: gcom-calendar-v1-
      - name: Import published club events
        id: calendar
        continue-on-error: true
        env:
          LUMA_ICAL_URL: ${{ secrets.LUMA_ICAL_URL }}
        run: npm run sync:events
      - name: Report stale calendar
        if: steps.calendar.outcome == 'failure'
        run: echo '::warning::Calendar sync failed. This release uses the last valid snapshot.'
      - name: Require a previous snapshot on sync failure
        if: steps.calendar.outcome == 'failure'
        run: node -e 'if (!require("./public/data/events.json").updatedAt) throw new Error("No previous calendar snapshot is available. Preserve the existing release.")'
      - run: npm run build
      - name: Custom domain
        if: env.SITE_BASE == '/'
        run: node -e 'require("node:fs").writeFileSync("dist/CNAME", new URL(process.env.SITE_ORIGIN).hostname + "\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
