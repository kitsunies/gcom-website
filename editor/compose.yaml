services:
  editor:
    platform: linux/amd64
    build: .
    restart: unless-stopped
    env_file:
      - ${EDITOR_ENV_FILE:?Set an absolute secrets env file outside source}
    environment:
      COMMITTEE_ALLOWLIST_FILE: /run/committee/committee-allowlist.json
    ports:
      - '127.0.0.1:8091:8091'
    volumes:
      - ${EDITOR_DATA_DIR:?Set persistent data directory outside source}:/data
      - ${EDITOR_ALLOWLIST_DIR:?Set an external allowlist directory}:/run/committee:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8091/api/editor/setup').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
